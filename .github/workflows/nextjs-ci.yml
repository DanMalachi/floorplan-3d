name: nextjs-ci

# Lint + typecheck + build for the Next.js app (root package.json). Separate
# from extraction-ci.yml, which covers only the Python extraction pipeline
# under extraction/ — this workflow doesn't touch that.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `next lint` was removed in Next.js 16, so this calls eslint directly
      # (eslint 9 flat config, see eslint.config.mjs).
      #
      # Gates on ERRORS only. The repo carries ~40 pre-existing warnings, mostly
      # unused variables; failing on those would mean the first PR to touch this
      # branch is red for reasons unrelated to it. Errors are held at zero, so a
      # new one blocks — which is the part that protects the branch. Drive the
      # warning count down over time, then add --max-warnings to ratchet it.
      - name: Lint
        run: npm run lint

      # Runs all 29 suites (see docs/TESTING.md). Before this existed, 17 were
      # wired to an npm script, 12 were reachable only by typing the path, and
      # CI ran none of them — so a green build proved nothing about the tests.
      #
      # Coverage comes from c8, not vitest's own provider: every suite runs as a
      # CHILD process, which vitest worker-scoped v8 instrumentation cannot see
      # (it reported a flat 0% across 16,070 statements). c8 sets
      # NODE_V8_COVERAGE for the whole process tree, so it sees the children.
      #
      # Thresholds live in .c8rc.json, set just under the 2026-08-24 measured
      # baseline (36.21% lines / 77.33% branches / 62.68% functions) so the
      # gate ratchets upward rather than failing on arrival. Raise them as
      # coverage improves; never lower them to make a red build green.
      - name: Test + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # Gate on high/critical only, not moderate/low.
      #
      # The backlog this gate was written around (5 high + 1 moderate: nanoid,
      # next, pdfjs-dist, postcss, sharp, undici) is now CLEARED — as of
      # 2026-08-24 `npm audit` reports 0 vulnerabilities at every level. The
      # last three (next, and postcss + sharp underneath it) went out with the
      # next 16.3.2 upgrade; postcss and sharp had no parent other than next,
      # so bumping next was the whole fix.
      #
      # That means the "tighten once the backlog is cleared" note that used to
      # live here is now unblocked: `--audit-level=moderate` would pass today.
      # Left at `high` deliberately so tightening is a decision on its own PR
      # rather than a side effect of the upgrade — flipping one word here is
      # all it takes when you want it.
      - run: npm audit --audit-level=high
