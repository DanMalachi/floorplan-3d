name: extraction-ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default GITHUB_TOKEN can write to the repo. These jobs only
# read it, so a compromised dependency or action cannot push, tag or open PRs.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r extraction/requirements.txt
      - run: pytest tests/
      - name: eval self-test
        run: python -m eval.cli selftest
