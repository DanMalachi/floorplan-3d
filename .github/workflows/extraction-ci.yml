name: extraction-ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default GITHUB_TOKEN can write to the repo. These jobs only
# read it, so a compromised dependency or action cannot push, tag or open PRs.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r extraction/requirements.txt
      - run: pytest tests/
      - name: eval self-test
        run: python -m eval.cli selftest
