name: extraction-ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default GITHUB_TOKEN can write to the repo. These jobs only
# read it, so a compromised dependency or action cannot push, tag or open PRs.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r extraction/requirements.txt
      - run: pytest tests/
      - name: eval self-test
        run: python -m eval.cli selftest
